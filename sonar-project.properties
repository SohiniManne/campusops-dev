# SonarQube / SonarCloud Configuration for CampusOps
sonar.projectKey=campusops
sonar.organization=campusops-college
sonar.projectName=CampusOps
sonar.projectVersion=1.0

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/.terraform/**,**/build/**

# Python & JS settings
sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

